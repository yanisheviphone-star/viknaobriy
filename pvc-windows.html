<style>
.pw-hero{position:relative;padding:56px 48px 72px;background:var(--white)}
.pw-hero-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;align-items:stretch;gap:0}
.pw-crumbs{max-width:1280px;margin:0 auto 24px}
.pw-photo{position:relative;aspect-ratio:4/4.6;background:var(--color-plate,#F1F1F1);overflow:hidden}
.pw-photo img{width:100%;height:100%;object-fit:cover;display:block}
.pw-txt{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:0}
.crumbs{display:flex;align-items:center;gap:8px;font-family:var(--font-sans);font-size:13px;color:var(--color-text-tertiary)}
.crumbs a{color:var(--color-text-secondary);text-decoration:none;transition:color .15s ease}
.crumbs a:hover{color:var(--color-primary)}
.crumbs span{color:var(--color-text-tertiary)}
.pw-plate{background:var(--white);padding:38px 44px 34px;margin-left:-132px;border:1px solid var(--color-border)}
.pw-plate h1{font-family:var(--font-sans);font-weight:700;font-size:clamp(28px,3.1vw,46px);line-height:1.1;letter-spacing:-.025em;color:var(--color-text);margin:0}
.pw-plate h1 em{font-style:normal;color:var(--color-primary)}
.pw-lede{font-family:var(--font-sans);font-size:15.5px;line-height:1.65;color:var(--color-text-secondary);margin:0;padding-left:56px;max-width:46ch;text-wrap:pretty}
.pw-acts{display:flex;flex-wrap:wrap;gap:12px;padding-left:56px}
.pw-diia{position:absolute;left:56px;bottom:0;display:inline-flex;align-items:center;gap:12px;padding:12px 18px 12px 14px;border:1px solid var(--color-border);background:transparent}
.pw-diia img{width:38px;height:38px;display:block;flex-shrink:0}
.pw-diia span{font-family:var(--font-sans);font-size:14.5px;font-weight:600;line-height:1.35;color:var(--color-text);text-wrap:pretty}
.pw-sec{padding:80px 48px;background:var(--white)}
.pw-sec.plate{background:var(--color-bg-subtle,#F5F6F8)}
.pw-inner{max-width:1280px;margin:0 auto}
.pw-eyebrow{font-family:var(--font-sans);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--color-primary);margin:0 0 12px}
.pw-h2{font-family:var(--font-sans);font-weight:700;font-size:clamp(24px,2.4vw,34px);line-height:1.15;letter-spacing:-.02em;color:var(--color-text);margin:0 0 38px;text-wrap:pretty}
.pw-benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.pw-benefit{background:var(--color-plate,#F1F1F1);padding:26px 24px 28px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.pw-benefit .ico{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--color-primary)}
.pw-benefit b{font-family:var(--font-sans);font-size:16.5px;font-weight:700;line-height:1.3;color:var(--color-text)}
.pw-benefit span{font-family:var(--font-sans);font-size:14px;line-height:1.6;color:var(--color-text-secondary);margin-top:auto}
.pw-split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.pw-incl{display:flex;flex-direction:column}
.pw-incl-row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--color-border)}
.pw-incl-row:first-child{border-top:1px solid var(--color-border)}
.pw-incl-row svg{flex-shrink:0;margin-top:2px}
.pw-incl-row b{display:block;font-family:var(--font-sans);font-size:15.5px;font-weight:700;color:var(--color-text);line-height:1.35}
.pw-incl-row span{display:block;font-family:var(--font-sans);font-size:14px;line-height:1.6;color:var(--color-text-secondary);margin-top:4px}
.pw-spec{background:var(--white);border:1px solid var(--color-border)}
.pw-spec-head{padding:18px 24px;background:var(--color-ink,#111827);color:#fff;font-family:var(--font-sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.pw-spec-row{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:15px 24px;border-bottom:1px solid var(--color-border)}
.pw-spec-row:last-child{border-bottom:0}
.pw-spec-row span{font-family:var(--font-sans);font-size:14.5px;color:var(--color-text-secondary)}
.pw-spec-row b{font-family:ui-monospace,monospace;font-size:14.5px;font-weight:600;color:var(--color-text);text-align:right}
.pw-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pw-shot{position:relative;aspect-ratio:4/3;background:var(--color-plate,#F1F1F1);overflow:hidden}
.pw-shot:first-child{grid-column:span 2;aspect-ratio:8/3.05}
.pw-shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.pw-shot:hover img{transform:scale(1.03)}
.pw-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.pw-step{border-top:2px solid var(--color-primary);padding:18px 0 0}
.pw-step em{font-style:normal;font-family:ui-monospace,monospace;font-size:13px;color:var(--color-primary);letter-spacing:.06em}
.pw-step p{font-family:var(--font-sans);font-size:15px;line-height:1.55;color:var(--color-text);margin:10px 0 0;text-wrap:pretty}
.pw-cta{background:var(--color-ink,#111827);padding:80px 48px}
.pw-cta-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.pw-cta h2{font-family:var(--font-sans);font-weight:700;font-size:clamp(24px,2.5vw,36px);line-height:1.15;letter-spacing:-.02em;color:#fff;margin:0 0 16px;text-wrap:pretty}
.pw-cta p{font-family:var(--font-sans);font-size:15.5px;line-height:1.65;color:rgba(255,255,255,.62);margin:0;max-width:46ch}
.pw-cta-phones{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.pw-cta-phones a{font-family:var(--font-sans);font-size:20px;font-weight:700;color:#fff;text-decoration:none;letter-spacing:-.01em}
.pw-cta-phones a:hover{color:#fff;opacity:.7}
.pw-form{background:var(--white);padding:8px}
.ps{padding:80px 48px;background:var(--white);border-top:1px solid var(--color-border)}
.ps-inner{max-width:1280px;margin:0 auto}
.ps-brands{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--color-border);background:var(--color-bg-subtle,#F5F6F8);margin-bottom:0}
.ps-brand{position:relative;font-family:var(--font-sans);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-secondary);background:transparent;border:0;border-right:1px solid var(--color-border);padding:22px 20px;cursor:pointer;transition:color .15s ease,background .15s ease;min-height:64px}
.ps-brand:last-child{border-right:0}
.ps-brand:hover{color:var(--color-text)}
.ps-brand.on{background:var(--white);color:var(--color-primary)}
.ps-brand.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--color-primary)}
.ps-series{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--color-border);border-top:0;background:var(--white)}
.ps-serie{font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--color-text-tertiary);background:transparent;border:0;border-right:1px solid var(--color-border);padding:16px 22px;cursor:pointer;transition:color .15s ease,background .15s ease}
.ps-serie:hover{color:var(--color-text)}
.ps-serie.on{color:var(--color-text);background:var(--color-plate,#F1F1F1)}
.ps-panel{border:1px solid var(--color-border);border-top:0;background:var(--white)}
.ps-top{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr) minmax(0,.9fr);gap:0}
.ps-cut{padding:32px;border-right:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;background:var(--color-bg-subtle,#F5F6F8)}
.ps-cut image-slot,.ps-cut .photo-pending{width:100%;aspect-ratio:1/1;height:auto}
.ps-col{padding:32px 30px;border-right:1px solid var(--color-border);min-width:0}
.ps-col:last-child{border-right:0}
.ps-col-title{font-family:var(--font-sans);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--color-primary);margin:0 0 22px}
.ps-row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:11px 0;border-bottom:1px solid var(--color-border)}
.ps-row:last-child{border-bottom:0}
.ps-row span{font-family:var(--font-sans);font-size:14px;line-height:1.4;color:var(--color-text-secondary)}
.ps-row b{font-family:ui-monospace,monospace;font-size:14px;font-weight:600;color:var(--color-text);text-align:right;white-space:nowrap}
.ps-meter{margin-bottom:26px}
.ps-meter:last-child{margin-bottom:0}
.ps-meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
.ps-meter-top span{font-family:var(--font-sans);font-size:14px;color:var(--color-text-secondary)}
.ps-meter-top b{font-family:ui-monospace,monospace;font-size:14px;font-weight:700;color:var(--color-primary)}
.ps-bar{height:6px;background:var(--color-plate-strong,#E6E7E8)}
.ps-bar i{display:block;height:100%;background:var(--color-primary);transition:width .35s cubic-bezier(.2,.7,.3,1)}
.ps-desc{padding:28px 30px;border-top:1px solid var(--color-border)}
.ps-desc h4{font-family:var(--font-sans);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--color-text-tertiary);margin:0 0 12px}
.ps-desc p{font-family:var(--font-sans);font-size:15px;line-height:1.65;color:var(--color-text-secondary);margin:0;max-width:104ch;text-wrap:pretty}
.ps-foot{display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;padding:26px 30px;border-top:1px solid var(--color-border);background:var(--color-bg-subtle,#F5F6F8)}
.ps-price em{display:block;font-style:normal;font-family:var(--font-sans);font-size:13px;color:var(--color-text-tertiary);margin-bottom:6px}
.ps-price b{font-family:var(--font-sans);font-size:34px;font-weight:700;letter-spacing:-.02em;color:var(--color-text)}
.ps-price b i{font-style:normal;font-size:16px;font-weight:600;color:var(--color-text-secondary);margin-left:6px}
.ps-foot-acts{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ps-foot-acts button svg{transition:transform .2s ease}
.pp{padding:72px 0 84px;background:var(--white);border-top:1px solid var(--color-border);overflow:hidden}
.pp h2{font-family:var(--font-sans);font-weight:700;font-size:clamp(22px,2.2vw,30px);line-height:1.15;letter-spacing:-.02em;color:var(--color-text);margin:0 0 40px;text-align:center;padding:0 24px}
.pp-strip{position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.pp-track{display:flex;align-items:center;gap:0;width:max-content;animation:pp-scroll 38s linear infinite}
.pp-strip:hover .pp-track{animation-play-state:paused}
.pp-item{flex:0 0 auto;width:230px;height:96px;display:flex;align-items:center;justify-content:center;padding:0 28px;border-right:1px solid var(--color-border)}
.pp-item img{max-width:100%;max-height:56px;width:auto;height:auto;object-fit:contain;display:block;filter:grayscale(1);opacity:.62;transition:filter .2s ease,opacity .2s ease}
.pp-item:hover img{filter:none;opacity:1}
@keyframes pp-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.pp-track{animation:none}}
.ps-foot-acts button:hover svg{transform:translateX(5px)}
.ps-pay{order:2;position:relative;cursor:default}
.ps-tip{position:absolute;bottom:calc(100% + 10px);right:0;width:340px;max-width:min(340px,calc(100vw - 48px));background:var(--white);border:1px solid var(--color-border);padding:18px 20px;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .15s ease,transform .15s ease,visibility .15s;z-index:5;text-align:left}
.ps-pay:hover .ps-tip,.ps-pay:focus-within .ps-tip{opacity:1;visibility:visible;transform:translateY(0)}
.ps-tip b{display:block;font-family:var(--font-sans);font-size:13.5px;font-weight:700;color:var(--color-primary);margin-bottom:5px}
.ps-tip p{font-family:var(--font-sans);font-size:13px;line-height:1.55;color:var(--color-text-secondary);margin:0 0 14px;text-wrap:pretty;hyphens:none}
.ps-tip p:last-child{margin-bottom:0}
.ps-pay{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;background:var(--white);border:1px solid var(--color-border)}
.ps-pay img{height:52px;width:auto;display:block;flex-shrink:0}
.ps-pay span{display:block;font-family:var(--font-sans);font-size:13px;font-weight:600;line-height:1.3;color:var(--color-text)}
.ps-pay em{display:block;font-style:normal;font-family:var(--font-sans);font-size:11.5px;line-height:1.3;color:var(--color-text-tertiary);margin-top:2px}
@media (max-width:1080px){
.ps-top{grid-template-columns:1fr 1fr}
.ps-cut{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--color-border);padding:26px}
.ps-cut image-slot,.ps-cut .photo-pending{max-width:360px}
}
@media (max-width:1080px){
.pw-benefits{grid-template-columns:repeat(2,1fr)}
.pw-steps{grid-template-columns:repeat(2,1fr)}
.pw-plate{margin-left:-80px;padding:30px 32px}
}
@media (max-width:900px){
.pw-hero{padding:28px 24px 56px}.pw-hero-inner{grid-template-columns:1fr;gap:0}
.pw-photo{aspect-ratio:4/3}
.pw-txt{padding:0;gap:22px}
.pw-plate{margin:-56px 0 0;padding:26px 24px;position:relative;width:100%}
.crumbs{padding:0}
.pw-lede,.pw-acts{padding-left:0}
.pw-diia{position:static;margin:0;width:100%}
.pw-txt{justify-content:flex-start;gap:22px}
.pw-sec,.pw-cta{padding:56px 24px}
.pw-split{grid-template-columns:1fr;gap:36px}
.pw-gallery{grid-template-columns:1fr 1fr}
.pw-shot:first-child{grid-column:span 2;aspect-ratio:16/9}
.pw-cta-inner{grid-template-columns:1fr;gap:34px}
.ps{padding:56px 24px}
.ps-brands{grid-template-columns:1fr}
.ps-brand{border-right:0;border-bottom:1px solid var(--color-border);text-align:left;min-height:56px;padding:16px 18px}
.ps-brand:last-child{border-bottom:0}
.ps-brand.on::after{left:0;top:0;bottom:0;right:auto;width:3px;height:auto}
.ps-series{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
.ps-serie{white-space:nowrap;padding:14px 18px}
.ps-top{grid-template-columns:1fr}
.ps-col{border-right:0;border-bottom:1px solid var(--color-border);padding:26px 22px}
.ps-col:last-child{border-bottom:0}
.ps-desc,.ps-foot{padding:24px 22px}
.ps-foot{flex-direction:column;align-items:stretch;gap:18px}
.ps-foot-acts{flex-direction:column;align-items:stretch;gap:14px}
.ps-pay{justify-content:flex-start}
.pp{padding:52px 0 60px}
.pp h2{margin-bottom:28px}
.pp-item{width:172px;height:82px;padding:0 22px}
.pp-item img{max-height:44px}
.ps-tip{right:auto;left:0;width:100%;max-width:none}
.ps-pay img{height:46px}
.ps-foot-acts button{width:100%}
}
@media (max-width:560px){
.pw-benefits{grid-template-columns:1fr}
.pw-steps{grid-template-columns:1fr}
.pw-gallery{grid-template-columns:1fr}
.pw-shot:first-child{grid-column:span 1}
.pw-plate{margin-top:-40px;width:100%}
.ps-price b{font-size:29px}
}
</style>
</head>

<div id="root"></div>
<script type="text/babel" data-presets="react" src="assets/js/shell.jsx"></script>
<script type="text/babel" data-presets="react">
function px(id,w){ return 'https://images.pexels.com/photos/'+id+'/pexels-photo-'+id+'.jpeg?auto=compress&cs=tinysrgb&w='+(w||1200); }
const check = React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none'},
  React.createElement('path',{d:'M4 12.6l5.2 5.2L20 7',stroke:'var(--color-primary)',strokeWidth:2.4,strokeLinecap:'square'})
);

function PwHero(){
  return React.createElement('section',{className:'pw-hero',id:'product-hero','data-screen-label':'Хіро послуги'},
    React.createElement('div',{className:'pw-crumbs'},
      React.createElement('nav',{className:'crumbs'},
        React.createElement('a',{href:'index.html'},'Головна'),
        React.createElement('span',null,'/'),
        React.createElement('span',null,'Металопластикові вікна')
      )
    ),
    React.createElement('div',{className:'pw-hero-inner'},
      React.createElement('div',{className:'pw-photo'},
        React.createElement('img',{src:'assets/images/pvc-windows-living-room.webp',alt:'Металопластикові вікна у вітальні',loading:'eager'})
      ),
      React.createElement('div',{className:'pw-txt'},
        React.createElement('div',{className:'pw-plate'},
          React.createElement('h1',null,'Металопластикові вікна в Харкові ',React.createElement('em',null,'від виробника ЕКІПАЖ'))
        ),
        React.createElement('p',{className:'pw-lede'},'Виготовляємо вікна на власному виробництві — від зварювання профілю до монтажу на об’єкті. Профільні системи VEKA, WDS та ЕКІПАЖ, фурнітура AXOR і Winkhaus. Підбираємо рішення під ваш бюджет: від економ- до преміум-класу.'),
        React.createElement('div',{className:'pw-diia'},
          React.createElement('img',{src:'assets/images/diia-logo.webp',alt:'Дія',loading:'lazy'}),
          React.createElement('span',null,'Працюємо за програмою єВідновлення')
        )
      )
    )
  );
}

function PwBenefits(){
  const items = [
    {icon:'window',title:'5–7 камер у профілі',desc:'Тримають тепло взимку та не пропускають вуличний шум і пил'},
    {icon:'shield-check',title:'Гарантія 5 років',desc:'На конструкцію, фурнітуру та монтажні роботи — за договором'},
    {icon:'clock',title:'Виготовлення 5–7 днів',desc:'Дату монтажу фіксуємо в договорі і тримаємо її'},
    {icon:'truck',title:'Доставка безкоштовно',desc:'Привеземо конструкції на об’єкт без доплат за логістику'}
  ];
  return React.createElement('section',{className:'pw-sec plate','data-screen-label':'Переваги'},
    React.createElement('div',{className:'pw-inner'},
      React.createElement('p',{className:'pw-eyebrow'},'Чому наші вікна'),
      React.createElement('h2',{className:'pw-h2'},'Кожне вікно робимо під розмір вашого проєму'),

<style>
.pw-hero{position:relative;padding:56px 48px 72px;background:var(--white)}
.pw-hero-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;align-items:stretch;gap:0}
.pw-crumbs{max-width:1280px;margin:0 auto 24px}
.pw-photo{position:relative;aspect-ratio:4/4.6;background:var(--color-plate,#F1F1F1);overflow:hidden}
.pw-photo image-slot,.pw-photo .photo-pending{width:100%;height:100%}
.pw-txt{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:0}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:var(--font-sans);font-size:13px;color:var(--color-text-tertiary)}
.crumbs a{color:var(--color-text-secondary);text-decoration:none;transition:color .15s ease}
.crumbs a:hover{color:var(--color-primary)}
.crumbs span{color:var(--color-text-tertiary)}
.pw-plate{background:var(--white);padding:38px 44px 34px;margin-left:-132px;border:1px solid var(--color-border)}
.pw-plate h1{font-family:var(--font-sans);font-weight:700;font-size:clamp(28px,3.1vw,46px);line-height:1.1;letter-spacing:-.025em;color:var(--color-text);margin:0}
.pw-plate h1 em{font-style:normal;color:var(--color-primary)}
.pw-lede{font-family:var(--font-sans);font-size:15.5px;line-height:1.65;color:var(--color-text-secondary);margin:0;padding-left:56px;max-width:48ch;text-wrap:pretty}
.pw-diia{position:absolute;left:56px;bottom:0;display:inline-flex;align-items:center;gap:12px;padding:12px 18px 12px 14px;border:1px solid var(--color-border);background:transparent}
.pw-diia img{width:38px;height:38px;display:block;flex-shrink:0}
.pw-diia span{font-family:var(--font-sans);font-size:14.5px;font-weight:600;line-height:1.35;color:var(--color-text);text-wrap:pretty}
.pw-eyebrow{font-family:var(--font-sans);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--color-primary);margin:0 0 12px}
.pw-h2{font-family:var(--font-sans);font-weight:700;font-size:clamp(24px,2.4vw,34px);line-height:1.15;letter-spacing:-.02em;color:var(--color-text);margin:0 0 14px;text-wrap:pretty}
.bl{padding:80px 48px;background:var(--white);border-top:1px solid var(--color-border)}
.bl-inner{max-width:1280px;margin:0 auto}
.bl-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin:0 0 34px}
.bl-note{font-family:var(--font-sans);font-size:14px;line-height:1.6;color:var(--color-text-secondary);margin:0;max-width:44ch;text-wrap:pretty}
.bl-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--color-border);border:1px solid var(--color-border)}
.bl-tab{display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:var(--white);border:0;padding:14px 20px;cursor:pointer;transition:background .15s ease;text-align:left;min-width:0}
.bl-tab span{font-family:var(--font-sans);font-size:13.5px;font-weight:600;color:var(--color-text-tertiary);transition:color .15s ease;text-wrap:balance}
.bl-tab i{font-style:normal;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--color-text-tertiary);opacity:.8}
.bl-tab:hover span{color:var(--color-text)}
.bl-tab.on{background:var(--color-plate,#F1F1F1)}
.bl-tab.on span{color:var(--color-text)}
.bl-tab.on i{color:var(--color-primary);opacity:1}
.bl-panel{border:1px solid var(--color-border);border-top:0;background:var(--white);display:flex;flex-direction:column}
.bl-cap{padding:20px 28px;background:var(--color-ink);display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bl-cap h3{font-family:var(--font-sans);font-size:clamp(18px,1.9vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.2;color:#fff;margin:0;text-wrap:balance}
.bl-cap em{font-style:normal;font-family:ui-monospace,monospace;font-size:12.5px;letter-spacing:.06em;color:rgba(255,255,255,.6);flex-shrink:0}
.bl-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.bl-stage.models{grid-template-columns:248px minmax(0,1.05fr) minmax(0,1fr)}
.bl-shot{position:relative;border-right:1px solid var(--color-border);background:var(--white);padding:26px 24px 34px;display:flex;align-items:center;justify-content:center;min-width:0}
.bl-shot image-slot,.bl-shot .photo-pending{width:100%;height:340px;display:block}
.bl-shot em{position:absolute;left:24px;bottom:14px;font-style:normal;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary)}
.bl-intro{padding:24px 28px;border-bottom:1px solid var(--color-border);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
.bl-intro .bl-desc{margin:0}
.bl-intro .bl-list{margin:0}
.bl-models{display:flex;flex-direction:column;border-right:1px solid var(--color-border);max-height:472px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bl-model{display:flex;align-items:baseline;justify-content:space-between;gap:12px;text-align:left;background:var(--white);border:0;border-bottom:1px solid var(--color-border);padding:12px 18px;cursor:pointer;transition:background .15s ease,color .15s ease}
.bl-model:last-child{border-bottom:0}
.bl-model b{font-family:var(--font-sans);font-size:13.5px;font-weight:600;color:var(--color-text-tertiary);line-height:1.35;transition:color .15s ease}
.bl-model i{font-style:normal;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--color-text-tertiary);white-space:nowrap;opacity:.85}
.bl-model:hover b{color:var(--color-text)}
.bl-model.on{background:var(--color-plate,#F1F1F1)}
.bl-model.on b{color:var(--color-text)}
.bl-model.on i{color:var(--color-primary);opacity:1}
.bl-body{padding:28px 28px 30px;border-right:1px solid var(--color-border);min-width:0}
.bl-col-title{font-family:var(--font-sans);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--color-primary);margin:0 0 14px}
.bl-desc{font-family:var(--font-sans);font-size:14.5px;line-height:1.65;color:var(--color-text-secondary);margin:0 0 24px;text-wrap:pretty}
.bl-row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:11px 0;border-bottom:1px solid var(--color-border)}
.bl-row:last-child{border-bottom:0}
.bl-row span{font-family:var(--font-sans);font-size:14px;line-height:1.4;color:var(--color-text-secondary)}
.bl-row b{font-family:ui-monospace,monospace;font-size:13.5px;font-weight:600;color:var(--color-text);text-align:right;line-height:1.45;overflow-wrap:anywhere}
.bl-side{padding:28px 28px 30px;min-width:0;display:flex;flex-direction:column}
.bl-list{display:flex;flex-direction:column;gap:11px;margin:0 0 26px;padding:0;list-style:none}
.bl-list li{display:flex;gap:12px;font-family:var(--font-sans);font-size:14px;line-height:1.55;color:var(--color-text-secondary);text-wrap:pretty}
.bl-list li::before{content:'';flex:0 0 auto;width:7px;height:7px;margin-top:7px;background:var(--color-primary)}
.bl-empty{margin-top:auto;border:1px solid var(--color-border);background:var(--color-bg-subtle,#F5F6F8);padding:16px 18px;font-family:var(--font-sans);font-size:13.5px;line-height:1.55;color:var(--color-text-secondary);text-wrap:pretty}
.bl-foot{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px 28px;border-top:1px solid var(--color-border);background:var(--color-bg-subtle,#F5F6F8)}
.bl-price em{display:block;font-style:normal;font-family:var(--font-sans);font-size:13px;color:var(--color-text-tertiary);margin-bottom:6px}
.bl-price b{font-family:var(--font-sans);font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--color-text)}
.bl-price b i{font-style:normal;font-size:16px;font-weight:600;color:var(--color-text-secondary);margin-left:6px}
.bl-foot button svg{transition:transform .2s ease}
.bl-foot button:hover svg{transform:translateX(5px)}
.pp{padding:72px 0 84px;background:var(--white);border-top:1px solid var(--color-border);overflow:hidden}
.pp h2{font-family:var(--font-sans);font-weight:700;font-size:clamp(22px,2.2vw,30px);line-height:1.15;letter-spacing:-.02em;color:var(--color-text);margin:0 0 40px;text-align:center;padding:0 24px}
.pp-strip{position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.pp-track{display:flex;align-items:center;gap:0;width:max-content;animation:pp-scroll 38s linear infinite}
.pp-strip:hover .pp-track{animation-play-state:paused}
.pp-item{flex:0 0 auto;width:230px;height:96px;display:flex;align-items:center;justify-content:center;padding:0 28px;border-right:1px solid var(--color-border)}
.pp-item img{max-width:100%;max-height:56px;width:auto;height:auto;object-fit:contain;display:block;filter:grayscale(1);opacity:.62;transition:filter .2s ease,opacity .2s ease}
.pp-item:hover img{filter:none;opacity:1}
@keyframes pp-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.pp-track{animation:none}}
@media (max-width:1080px){
.pw-plate{margin-left:-80px;padding:30px 32px}
.bl-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){

.pw-hero-inner{grid-template-columns:1fr}
.pw-photo{aspect-ratio:4/3}
.pw-txt{padding:0;gap:22px;justify-content:flex-start}
.pw-plate{margin:-56px 0 0;padding:26px 24px;position:relative;width:100%}
.pw-lede{padding-left:0}
.pw-diia{position:static;margin:0;width:100%}
.bl{padding:56px 24px}
.bl-tabs{display:flex}
.bl-head{flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:24px}
.bl-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.bl-tab{flex:0 0 auto;width:auto;scroll-snap-align:start;padding:13px 18px;gap:5px}
.bl-tab span,.bl-tab i{white-space:nowrap;overflow:visible}
.bl-stage{grid-template-columns:1fr}
.bl-stage.models{grid-template-columns:1fr}
.bl-shot{border-right:0;border-bottom:1px solid var(--color-border);padding:20px 22px 30px}
.bl-shot image-slot,.bl-shot .photo-pending{height:240px}
.bl-shot em{left:22px;bottom:10px}
.bl-intro{grid-template-columns:1fr;gap:20px;padding:22px}
.bl-models{border-right:0;border-bottom:1px solid var(--color-border);max-height:224px}
.bl-body{border-right:0;border-bottom:1px solid var(--color-border);padding:24px 22px 26px}
.bl-side{padding:24px 22px 26px}
.bl-cap{padding:18px 22px}
.pp{padding:52px 0 60px}
.pp h2{margin-bottom:28px}
.pp-item{width:172px;height:82px;padding:0 22px}
.pp-item img{max-height:44px}
}
@media (max-width:640px){
.bl-foot{padding:20px 22px;flex-direction:column;align-items:stretch;gap:16px}
.bl-foot button{width:100%}
.pw-plate{margin-top:-40px;width:100%}
}

        )

function DrCatalog(){
  const [b,setB] = React.useState(0);
  const [m,setM] = React.useState(0);
  const [p,setP] = React.useState(0);
  const brand = DOORS[b];
  const idx = Math.min(m, brand.models.length-1);
  const item = brand.models[idx];
  const total = brand.models.length;
  const shots = item.photos || 1;
  const pi = Math.min(p, shots-1);
  const touch = React.useRef(null);
  function go(d){ setP((pi + d + shots) % shots); }
  function pick(i){ setM(i); setP(0); }
  const slotId = 'door-'+b+'-'+idx+'-'+pi;
  return React.createElement('section',{className:'ps',id:'doors-catalog','data-screen-label':'Каталог дверей'},
    React.createElement('div',{className:'ps-inner'},
      React.createElement('p',{className:'pw-eyebrow'},'Двері від ЕКІПАЖ'),
      React.createElement('h2',{className:'pw-h2'},'Асортимент'),
      React.createElement('div',{className:'ps-brands',role:'tablist','aria-label':'Тип дверей'},
        DOORS.map((d,i)=>React.createElement('button',{type:'button',key:d.brand,role:'tab','aria-selected':i===b,className:'ps-brand'+(i===b?' on':''),onClick:()=>{setB(i);setM(0);setP(0);}},d.kind+' двері ',React.createElement('br'),d.brand))
      ),
      React.createElement('div',{className:'ps-series',role:'tablist','aria-label':'Модель'},
        brand.models.map((x,i)=>React.createElement('button',{type:'button',key:x.name,role:'tab','aria-selected':i===idx,className:'ps-serie'+(i===idx?' on':''),onClick:()=>pick(i)},x.name))
      ),
      React.createElement('div',{className:'ps-panel'},
        React.createElement('div',{className:'dr-stage'},
          React.createElement('div',{className:'dr-photo',
            onTouchStart:(e)=>{touch.current=e.touches[0].clientX;},
            onTouchEnd:(e)=>{ if(touch.current==null) return; const dx=e.changedTouches[0].clientX-touch.current; if(Math.abs(dx)>40) go(dx<0?1:-1); touch.current=null; }},
            React.createElement('div',{className:'dr-tag'},item.name),
            React.createElement(Photo,{id:slotId,key:slotId,placeholder:item.name+' — фото '+(pi+1),shape:'rect'}),
            shots>1 && React.createElement('button',{type:'button',className:'dr-nav prev','aria-label':'Попереднє фото',onClick:()=>go(-1)},chev('prev')),
            shots>1 && React.createElement('button',{type:'button',className:'dr-nav next','aria-label':'Наступне фото',onClick:()=>go(1)},chev('next')),
            shots>1 && React.createElement('div',{className:'dr-dots'},
              Array.from({length:shots},(_,i)=>React.createElement('button',{type:'button',key:i,'aria-label':'Фото '+(i+1),className:i===pi?'on':'',onClick:()=>setP(i)}))
            )
          ),
          React.createElement('div',{className:'dr-info'},
            React.createElement('div',{className:'dr-info-body'},
              React.createElement('div',{className:'dr-info-head'},
                React.createElement('h3',{className:'dr-model'},item.name),
                React.createElement('span',{className:'dr-count'},String(idx+1).padStart(2,'0')+' / '+String(total).padStart(2,'0'))
              ),
              React.createElement('p',{className:'dr-model-sub'},item.sub),
              React.createElement('p',{className:'ps-col-title'},'Технічні характеристики'),
              item.specs.map(([k,v])=>React.createElement('div',{className:'ps-row',key:k},
                React.createElement('span',null,k),
                React.createElement('b',null,v)
              ))
            ),
            React.createElement('div',{className:'dr-foot'},
              React.createElement('div',{className:'ps-price'},
                React.createElement('em',null,item.note||'Ціна за готову конструкцію'),
                React.createElement('b',null,'від '+item.price,React.createElement('i',null,item.unit))
              ),
              React.createElement(Button,{variant:'primary',size:'lg',icon:'arrow-right',iconPosition:'right',onClick:openQuote},'Замовити зараз')
            )
          )
        )
      )
    )
  );
}
